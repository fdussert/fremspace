name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: test, build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `shell: bash` runs with pipefail: without it the step's result is `tail`'s, and failing
      # tests pass.
      - name: Tests
        shell: bash
        run: scripts/test.sh | tail -5

      # Signed ad hoc: the runner has no signing identity, and nothing here is shipped.
      - name: Build
        run: scripts/build.sh
